name: Build APK
on:
  push:
    branches: [ main ]
    paths: [ 'release.txt' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: |
          VN="1.0.$((GITHUB_RUN_NUMBER-1))"
          echo "VN=$VN" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "MyAlbum-$VN.apk"
          ls -la *.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: האלבום שלי ${{ env.VN }}
          body: |
            📸 האלבום שלי — גרסה ${{ env.VN }} (בנייה ${{ github.run_number }})
            ${{ github.event.head_commit.message }}
          files: MyAlbum-${{ env.VN }}.apk
          make_latest: true
