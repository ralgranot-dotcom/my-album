name: Compile check
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'app/src/main/java/**', 'app/src/main/AndroidManifest.xml', 'app/src/main/res/**', '**.gradle', '.github/workflows/check.yml' ]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
